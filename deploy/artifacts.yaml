# fired-artifacts configuration. Every key is optional; the values shown are
# the defaults unless noted. Env overrides: FIRED_ARTIFACTS_TOKEN,
# FIRED_ARTIFACTS_LISTEN, FIRED_ARTIFACTS_DATABASE_URL, FIRED_ARTIFACTS_DATA_DIR,
# FIRED_URL, FIRED_API_TOKEN,
# FIRED_ARTIFACTS_BROKER_URL, FIRED_ARTIFACTS_BROKER_TOKEN, FIRED_ARTIFACTS_UI,
# FIRED_ARTIFACTS_PREVIEW_DOMAIN.

listen: ":8444"
token: ""                       # required; prefer FIRED_ARTIFACTS_TOKEN

# Postgres for records (artifacts, versions, jobs, runs), normally fired's
# database: the tables go in their own schema, "artifacts". Required; prefer
# FIRED_ARTIFACTS_DATABASE_URL.
database_url: ""

# The blob store (file contents). Artifacts are kept work: put this on
# durable storage.
data_dir: /data/artifacts

# The fired daemon jobs run on.
fired:
  url: http://127.0.0.1:8443
  token: ""                     # prefer FIRED_API_TOKEN

# Your backend's credentials endpoint, POSTed before every run with
# {artifact, quota_key, labels, version, job, run_id}; it answers
# {secret_env, secret_files}. Empty url runs jobs without credentials.
broker:
  url: ""
  token: ""
  timeout: 10s

limits:
  max_files_per_version: 5000
  max_version_bytes: 268435456  # 256 MiB
  max_inline_bytes: 4194304     # content/content_base64 per publish
  default_active_for: 12h       # schedule window after a publish, without approval
  default_max_run: 30m          # longest run without approval
  # Per-user limits aren't configured here: storage and schedule interval
  # come from tiers (PUT /v1/tiers/{name}), the tier a key is in from fired's
  # mapping, compute from fired's tiers. See docs/cluster.md.
  max_concurrent_runs: 8        # runs this service drives at once
  min_interval: 1m              # shortest schedule interval for anyone
  serve_rps: 50                 # file reads per artifact per second
  serve_burst: 100
  retain_runs: 24               # run-produced versions kept per artifact
  delete_after: 0s              # delete artifacts inactive this long (0 = never)
  queue_max: 100                # defaults for on_busy: queue
  queue_max_age: 24h
  max_payload_bytes: 1048576

runner:
  template: base                # fired template for jobs that don't name one
  pool: artifacts               # fired pool for runners: hosts, and each user's compute budget
  quota_backoff: 1m             # a key's runs wait this long after fired refuses one over its limits
  workdir: /artifact
  egress: []                    # allowlist for runner sandboxes, e.g. ["api.github.com"]
  ttl:                          # runner sandboxes are a cache; these are fired TTLs
    idle_suspend: 1m
    archive_after: 1h
    delete_after: 48h
  log_bytes: 262144             # tail kept per stream per run

scheduler_interval: 5s
gc_interval: 1h
log_level: info

# Browser console at /ui/ (sign in with the token). Artifact files are shown
# on their own origin, {id}-{version}-{sig}.<preview_domain>; empty uses
# nip.io for the IP the console is reached on.
ui: false
preview_domain: ""
